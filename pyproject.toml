[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gemini"
version = "0.1.1"
description = "An async and static-typed library for working with Gemini."
readme = "README.md"
authors = [
    { name = "stefanlight8", email = "64615032+stefanlight8@users.noreply.github.com" },
]
requires-python = ">=3.10,<3.13"
dependencies = ["httpx>=0.26.0", "msgspec>=0.19.0"]

[project.optional-dependencies]
http2 = [
    "httpx[http2]>=0.28.1",
]
